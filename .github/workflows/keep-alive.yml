# Giữ cho Supabase gói miễn phí không bị tự tạm dừng (dừng khi ~1 tuần không có hoạt động).
# Cứ 2 ngày gọi 1 lần vào /api/ping của web trên Vercel, mà /api/ping sẽ chạm vào database.
name: Giữ Supabase hoạt động

on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi /api/ping
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 60 https://queenyflow.vercel.app/api/ping || echo 000)
            echo "Lần $i: HTTP $code $(cat /tmp/out.txt 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Ping thất bại 3 lần (Supabase có thể đang bị tạm dừng — vào dashboard bấm Restore project)."
          exit 1
